name: automerge
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
permissions:
  contents: write
  pull-requests: write
jobs:
  call:
    # Release Please upgrades need review even when the shared preset labels them.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'manual-review') }}
    uses: ervwalter/renovate-config/.github/workflows/automerge.yml@67dc7078de9973e13f59d6ed5fa3304c361590de # main
