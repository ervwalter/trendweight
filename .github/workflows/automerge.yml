name: automerge
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
permissions:
  contents: write
  pull-requests: write
jobs:
  call:
    # Release Please upgrades need review even when the shared preset labels them.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'manual-review') }}
    uses: twistymaze/renovate-config/.github/workflows/automerge.yml@5b0b2f2397d9c1ce221a7a36aa62c64ec35ab9f7 # main
    with:
      app-client-id: ${{ vars.AUTOMERGE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
